<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>API Durumu — rorcun.com</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(56,189,248,.06), transparent 60%),
      #0e1116;
    color: #e8eaed;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    text-align: center; padding: 44px 40px; max-width: 460px; margin: 16px;
    background: #161b22; border: 1px solid #2d3748; border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.35), 0 4px 6px -4px rgba(0,0,0,.35);
    animation: in .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .logo {
    width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 14px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: #8a93a3; font-size: 13px; margin: 0 0 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 600; border: 1px solid transparent;
  }
  .pill .led { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .ok     { background: rgba(74,222,128,.08); border-color: rgba(74,222,128,.35); color: #86efac; }
  .ok .led{ background: #4ade80; box-shadow: 0 0 10px #4ade80; }
  .down   { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.35); color: #fca5a5; }
  .down .led { background: #f87171; box-shadow: 0 0 10px #f87171; }
  .rows {
    margin-top: 26px; text-align: left; border-top: 1px solid #2d3748; padding-top: 18px;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 7px 2px;
  }
  .row .k { color: #5c6678; font-family: "JetBrains Mono", "Fira Code", monospace; }
  .row .v { color: #e8eaed; font-family: "JetBrains Mono", "Fira Code", monospace; }
  .hint { margin-top: 20px; font-size: 12px; color: #5c6678; font-family: "JetBrains Mono", "Fira Code", monospace; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; margin-right: 6px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card, .logo, .dot { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bk" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0f3d2e"/>
          <stop offset="100%" stop-color="#0f1a24"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="14" fill="url(#bk)"/>
      <circle cx="32" cy="32" r="18" fill="none" stroke="#4ade80" stroke-width="4" opacity="0.95"/>
      <circle cx="32" cy="32" r="7" fill="#4ade80"/>
    </svg>
    <h1>API Bağlantı Durumu</h1>
    <p class="sub">api.rorcun.com — arka plan sunucusu sağlık kontrolü</p>
    <span id="pill" class="pill"><span class="led"></span><span id="pillText">Kontrol ediliyor…</span></span>
    <div class="rows" id="rows" style="display:none">
      <div class="row"><span class="k">durum</span><span class="v" id="rStatus">—</span></div>
      <div class="row"><span class="k">model</span><span class="v" id="rModel">—</span></div>
      <div class="row"><span class="k">kuyruk</span><span class="v" id="rQueue">—</span></div>
      <div class="row"><span class="k">kontrol</span><span class="v" id="rTime">—</span></div>
    </div>
    <p class="hint"><span class="dot"></span>sayfa her 15 saniyede bir yenilenir</p>
  </div>
  <script>
    (function () {
      var pill = document.getElementById('pill');
      var pillText = document.getElementById('pillText');
      var rows = document.getElementById('rows');
      function setOK() { pill.className = 'pill ok'; pillText.textContent = 'Sunucu çalışıyor'; }
      function setDown() { pill.className = 'pill down'; pillText.textContent = 'Sunucu kapalı — bakımda'; }
      function refresh() {
        var t0 = Date.now();
        fetch('/api/v2/health', { cache: 'no-store' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (d) {
            setOK();
            rows.style.display = 'block';
            document.getElementById('rStatus').textContent = d.status || '—';
            document.getElementById('rModel').textContent = d.model || '—';
            var q = d.queue; var qs = '—';
            if (q) {
              var running = q.running || q.active || 0;
              var pending = q.pending || q.waiting || 0;
              qs = running + ' / ' + pending;
            }
            document.getElementById('rQueue').textContent = qs;
            document.getElementById('rTime').textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' sn';
          })
          .catch(function () { setDown(); rows.style.display = 'none'; });
      }
      refresh();
      setInterval(refresh, 15000);
    })();
  </script>
</body>
</html>
