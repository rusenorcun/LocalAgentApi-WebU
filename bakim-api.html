<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Bakımda — API</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(74,222,128,.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(56,189,248,.06), transparent 60%),
      #0e1116;
    color: #e8eaed;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    text-align: center; padding: 48px 40px; max-width: 420px; margin: 16px;
    background: #161b22; border: 1px solid #2d3748; border-radius: 16px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.35), 0 4px 6px -4px rgba(0,0,0,.35);
    animation: in .5s cubic-bezier(.22,1,.36,1);
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 22px; border-radius: 14px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  h1 { font-size: 20px; margin: 0 0 10px; font-weight: 600; letter-spacing: -.01em; }
  p  { color: #8a93a3; font-size: 14px; line-height: 1.625; margin: 0; }
  .hint {
    margin-top: 20px; padding-top: 16px; border-top: 1px solid #2d3748;
    font-size: 12px; color: #5c6678; font-family: "JetBrains Mono", "Fira Code", monospace;
  }
  .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card, .logo, .dot { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bk" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#0f3d2e"/>
          <stop offset="100%" stop-color="#0f1a24"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="14" fill="url(#bk)"/>
      <ellipse cx="32" cy="32" rx="14" ry="20" stroke="#4ade80" stroke-width="3.5" fill="none" opacity="0.95"/>
      <path d="M20 26 L44 26 M20 38 L44 38" stroke="#4ade80" stroke-width="3" opacity="0.5"/>
      <circle cx="32" cy="32" r="3.5" fill="#4ade80"/>
    </svg>
    <h1>API geçici olarak kapalı</h1>
    <p>api.rorcun.com arka plan sunucusuna ulaşamıyor. Bakım kısa sürecek, lütfen birazdan tekrar deneyin.</p>
    <p class="hint"><span class="dot"></span>bağlantı kurulduğunda bu sayfa otomatik olarak sağlık durumunu gösterir</p>
  </div>
</body>
</html>
